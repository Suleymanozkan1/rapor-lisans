<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zihin Molası</title>
    <meta name="description" content="Kısa turlu, çevrimdışı beyin egzersizi oyunu." />
    <style>
/* Zihin Molası — "gün batımı laboratuvarı": turuncu gökyüzü, laboratuvar yeşili, beyin pembesi.
   Düzen: tek sütun, en fazla 760px; oyun ekranında üstte gösterge, ortada sahne. */
:root {
  --paper: #fdf0e1;
  --surface: #fffaf4;
  --ink: #2a1733;
  --muted: #6a4f6e;
  --line: #ecd3bc;
  --primary: #23803c;
  --primary-ink: #ffffff;
  --highlight: #ffcf3a;
  --highlight-ink: #2a1733;
  --good: #1b7a3a;
  --good-bg: #ddf3e2;
  --bad: #b5302a;
  --bad-bg: #fbe1dc;
  --shape-bg: #fffaf4;
  --cell: #f4e2cf;
  --cell-lit: #ffcf3a;
  --sky-top: #f08a3e;
  --sky-mid: #f7b267;
  --sky-low: #fde2bf;
  --lab: #7a3f2a;
  --coat: #ffffff;
  --brain: #f6a5b9;
  --brain-line: #c4577a;
  --tube: #6fd77f;
  --gear: #8c7a92;

  --font-display: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
  --step-4: 3rem;

  --radius: 10px;
  --tap: 48px;
  --dur: 160ms;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #170f24;
    --surface: #241838;
    --ink: #f6edff;
    --muted: #bba7d2;
    --line: #3d2c57;
    --primary: #63d684;
    --primary-ink: #0f2414;
    --highlight: #ffcf3a;
    --highlight-ink: #2a1733;
    --good: #63d684;
    --good-bg: #163a22;
    --bad: #ff8a80;
    --bad-bg: #441f22;
    --shape-bg: #241838;
    --cell: #33264b;
    --cell-lit: #ffcf3a;
    --sky-top: #3a1f5c;
    --sky-mid: #5b2f6e;
    --sky-low: #2a1a40;
    --lab: #120b1d;
    --coat: #efe8f7;
    --brain: #f6a5b9;
    --brain-line: #c4577a;
    --tube: #63d684;
    --gear: #a996bd;
    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --paper: #170f24;
  --surface: #241838;
  --ink: #f6edff;
  --muted: #bba7d2;
  --line: #3d2c57;
  --primary: #63d684;
  --primary-ink: #0f2414;
  --highlight: #ffcf3a;
  --highlight-ink: #2a1733;
  --good: #63d684;
  --good-bg: #163a22;
  --bad: #ff8a80;
  --bad-bg: #441f22;
  --shape-bg: #241838;
  --cell: #33264b;
  --cell-lit: #ffcf3a;
  --sky-top: #3a1f5c;
  --sky-mid: #5b2f6e;
  --sky-low: #2a1a40;
  --lab: #120b1d;
  --coat: #efe8f7;
  --brain: #f6a5b9;
  --brain-line: #c4577a;
  --tube: #63d684;
  --gear: #a996bd;
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  background-color: var(--paper);
  background-image: linear-gradient(180deg, var(--sky-low) 0, var(--paper) 480px);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: 2px;
}

h1,
h2,
h3 {
  font-family: var(--font-display);
  line-height: 1.15;
  text-wrap: balance;
  margin: 0;
}

/* ---------- Üst çubuk ---------- */
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--surface);
  border-bottom: 2px solid var(--ink);
}

.topbar-inner,
.screen {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: 0;
  color: var(--ink);
  font: 700 var(--step-1) / 1 var(--font-display);
  cursor: pointer;
  padding: 6px 0;
  min-height: var(--tap);
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--highlight);
  color: var(--highlight-ink);
  font-size: 0.9rem;
  letter-spacing: 0.04em;
  transform: rotate(-4deg);
}

.nav {
  display: flex;
  gap: 4px;
}

.nav-btn {
  min-height: var(--tap);
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--ink);
  font: 600 var(--step--1) / 1 var(--font-body);
  cursor: pointer;
}

.nav-btn:hover {
  background: var(--cell);
}

.screen {
  padding-block: 24px 48px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.screen:focus {
  outline: none;
}

/* ---------- Düğmeler ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 20px;
  border-radius: var(--radius);
  border: 2px solid var(--ink);
  font: 700 var(--step-0) / 1.1 var(--font-display);
  cursor: pointer;
  transition: transform var(--dur), box-shadow var(--dur), background var(--dur);
}

.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
  box-shadow: 0 3px 0 var(--ink);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 0 var(--ink);
}

.btn-primary:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--ink);
}

.btn-secondary {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 3px 0 var(--ink);
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}

.btn-danger {
  color: var(--bad);
  border-color: var(--bad);
}

.btn-sm {
  min-height: 40px;
  padding: 0 12px;
  font-size: var(--step--1);
}

.btn:disabled {
  opacity: 0.5;
  cursor: default;
}

.row-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ---------- Menü ---------- */
.hero {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-block: 8px;
}

.hero-title {
  font-size: clamp(var(--step-2), 7vw, var(--step-4));
  font-weight: 800;
  letter-spacing: -0.01em;
}

.hl {
  background: var(--highlight);
  color: var(--highlight-ink);
  padding: 0 0.15em;
  border-radius: 4px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

.hero-sub,
.muted,
.hint {
  color: var(--muted);
  margin: 0;
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.section-title {
  font-size: var(--step-1);
}

.page-title {
  font-size: var(--step-3);
}

.game-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.cat {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.cat-title {
  font: 700 var(--step--1) / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.game-row {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 64px;
  padding: 10px 14px;
  text-align: left;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  font: inherit;
  transition: border-color var(--dur), transform var(--dur);
}

.game-row:hover {
  border-color: var(--ink);
  transform: translateX(2px);
}

.game-icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: 2px solid var(--ink);
  font: 700 1.3rem / 1 var(--font-display);
}

.game-icon.big {
  display: inline-grid;
  width: 52px;
  height: 52px;
  margin-right: 12px;
  vertical-align: middle;
  background: var(--highlight);
  color: var(--highlight-ink);
}

.game-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.game-text strong {
  font-family: var(--font-display);
  font-size: var(--step-0);
}

.game-text span {
  color: var(--muted);
  font-size: var(--step--1);
}

.game-best {
  text-align: right;
  font: 700 var(--step-0) / 1.1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.game-best small {
  display: block;
  font: 600 0.7rem / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.note {
  margin: 0;
  padding: 10px 14px;
  border-left: 4px solid var(--highlight);
  background: var(--surface);
  color: var(--ink);
}

/* ---------- Tanıtım ---------- */
.intro {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.eyebrow {
  margin: 0;
  font: 700 var(--step--1) / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.intro-title {
  font-size: var(--step-3);
}

.intro p {
  margin: 0;
  max-width: 65ch;
}

.reason {
  display: block;
  color: var(--muted);
  font-size: var(--step--1);
}

.howto {
  margin: 0;
  padding: 16px 16px 16px 40px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 65ch;
}

.plan {
  margin: 0;
  padding-left: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.facts {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  margin: 0;
}

.facts dt,
.stat-grid dt {
  font: 600 0.72rem / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.facts dd,
.stat-grid dd {
  margin: 2px 0 0;
  font: 700 var(--step-1) / 1.2 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.seg {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.seg legend {
  font-weight: 700;
  margin-bottom: 6px;
  padding: 0;
}

.seg-item {
  position: relative;
}

.seg-item input {
  position: absolute;
  opacity: 0;
  inset: 0;
  margin: 0;
  cursor: pointer;
}

.seg-item span {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 16px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
}

.seg-item input:checked + span {
  border-color: var(--ink);
  background: var(--highlight);
  color: var(--highlight-ink);
}

.seg-item input:focus-visible + span {
  outline: 3px solid var(--primary);
  outline-offset: 2px;
}

/* ---------- Oyun ekranı ---------- */
.play {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.hud {
  display: grid;
  grid-template-columns: auto 1fr 1fr 1.4fr;
  align-items: center;
  gap: 10px;
}

.hud-item {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.hud-item small {
  font: 600 0.68rem / 1.1 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.hud-val {
  font: 700 var(--step-1) / 1.1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.hud-score .hud-val {
  font-size: var(--step-2);
}

.timebar {
  position: relative;
  height: 26px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface);
}

.time-fill {
  position: absolute;
  inset: 0;
  background: var(--primary);
  transform-origin: left center;
  transform: scaleX(1);
}

.timebar.is-low .time-fill {
  background: var(--bad);
}

.timebar.is-rounds .time-fill {
  background: var(--good);
  transform: scaleX(0);
}

.time-text {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font: 700 var(--step--1) / 1 var(--font-num);
  color: var(--ink);
  background: var(--surface);
  padding: 2px 6px;
  border-radius: 6px;
}

.roundbar {
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  background: transparent;
}

.round-fill {
  display: block;
  height: 100%;
  background: var(--highlight);
  transform-origin: left center;
  transform: scaleX(0);
}

.banner {
  margin: 0;
  padding: 6px 12px;
  background: var(--highlight);
  color: var(--highlight-ink);
  font: 700 var(--step--1) / 1.3 var(--font-body);
  letter-spacing: 0.04em;
  border-radius: 6px;
  text-align: center;
}

.status {
  margin: 0;
  min-height: 1.5em;
  text-align: center;
  font: 600 var(--step-1) / 1.3 var(--font-display);
}

.stage {
  min-height: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.countdown {
  font: 800 5rem / 1 var(--font-display);
  margin-top: 40px;
  animation: pop 600ms ease-out;
}

.feedback {
  min-height: 3.2rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 12px;
  padding: 8px 12px;
  border-radius: var(--radius);
  text-align: center;
}

.feedback.is-ok {
  background: var(--good-bg);
  color: var(--good);
}

.feedback.is-bad {
  background: var(--bad-bg);
  color: var(--bad);
}

.fb-icon {
  font: 800 1.4rem / 1 var(--font-display);
}

.fb-pts {
  font: 700 var(--step-0) / 1 var(--font-num);
}

.fb-note {
  flex-basis: 100%;
  color: var(--ink);
  font-size: var(--step--1);
}

.fb-level {
  flex-basis: 100%;
  font-weight: 700;
  color: var(--ink);
}

.pause-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: var(--paper);
  border-radius: var(--radius);
}

/* Ortak seçenek ızgarası */
.choices {
  display: grid;
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 520px;
}

.choice {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 72px;
  padding: 10px;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  font: inherit;
  transition: border-color var(--dur), transform var(--dur);
}

.choice:hover:not(:disabled) {
  border-color: var(--ink);
}

.choice:active:not(:disabled) {
  transform: scale(0.97);
}

.choice:disabled {
  cursor: default;
}

.choice-key {
  position: absolute;
  top: 4px;
  left: 7px;
  font: 600 0.7rem / 1 var(--font-num);
  color: var(--muted);
}

.choice.is-correct {
  border-color: var(--good);
  background: var(--good-bg);
  box-shadow: inset 0 0 0 2px var(--good);
}

.choice.is-correct::after {
  content: '✓';
  position: absolute;
  top: 4px;
  right: 8px;
  color: var(--good);
  font-weight: 800;
}

.choice.is-wrong {
  border-color: var(--bad);
  background: var(--bad-bg);
}

.choice.is-wrong::after {
  content: '✕';
  position: absolute;
  top: 4px;
  right: 8px;
  color: var(--bad);
  font-weight: 800;
}

.label {
  font: 600 0.7rem / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.shape-bg {
  fill: var(--shape-bg);
}

.shape-bg-stop {
  stop-color: var(--shape-bg);
}

svg.shape {
  display: block;
  max-width: 100%;
  height: auto;
}

/* Hafıza Izgarası */
.mg-grid {
  display: grid;
  grid-template-columns: repeat(var(--n), minmax(0, 1fr));
  gap: 8px;
  width: min(100%, 420px);
}

.mg-cell {
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--cell);
  color: var(--highlight-ink);
  font: 800 var(--step-1) / 1 var(--font-num);
  cursor: pointer;
  transition: background var(--dur), transform var(--dur);
}

.mg-cell:disabled {
  cursor: default;
}

.mg-cell.mg-lit {
  background: var(--cell-lit);
  border-color: var(--ink);
  transform: scale(1.04);
}

.mg-cell.mg-ok {
  background: var(--good-bg);
  border-color: var(--good);
  box-shadow: inset 0 0 0 3px var(--good);
}

.mg-cell.mg-wrong {
  background: var(--bad-bg);
  border-color: var(--bad);
}

.mg-cell.mg-wrong::after {
  content: '✕';
  color: var(--bad);
}

.mg-cell.mg-missed {
  background: var(--cell-lit);
  border: 3px dashed var(--ink);
}

/* Hızlı Eşleştirme */
.qm-target,
.ps-head,
.mr-ref {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 24px;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--radius);
}

/* Zihinden Hesap */
.mm-problem {
  font: 800 clamp(2rem, 9vw, 3.4rem) / 1.1 var(--font-num);
  font-variant-numeric: tabular-nums;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 4px solid var(--highlight);
  text-align: center;
}

.mm-num {
  font: 700 var(--step-2) / 1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

/* Çift Odak */
.df-rule {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 16px;
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  text-align: center;
}

.df-rule.is-new {
  border-color: var(--ink);
  background: var(--highlight);
  color: var(--highlight-ink);
}

.df-rule.is-new .label {
  color: var(--highlight-ink);
}

.df-stage {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 460px;
}

.df-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 160px;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--radius);
}

.df-number {
  font: 800 4.5rem / 1 var(--font-num);
}

.df-caption {
  font-size: var(--step--1);
  color: var(--muted);
}

.df-distractors {
  grid-column: 1 / -1;
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  opacity: 0.55;
  font: 700 var(--step--1) / 1 var(--font-num);
}

.df-d {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.df-press {
  min-width: 200px;
  min-height: 64px;
  font-size: var(--step-2);
}

.df-press kbd {
  font: 600 0.7rem / 1 var(--font-body);
  opacity: 0.8;
}

/* Değişen Örüntü */
.ps-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 52px;
}

.ps-card.ps-target {
  min-height: 64px;
}

/* Mantık Devresi */
.lc-board {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 460px;
  padding: 14px;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--radius);
}

.lc-inputs {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.lc-input {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 2px solid var(--line);
  border-radius: 999px;
  font: 700 var(--step-0) / 1 var(--font-num);
}

.lc-input.is-on {
  background: var(--highlight);
  color: var(--highlight-ink);
  border-color: var(--ink);
}

.lc-input.is-hidden {
  border-style: dashed;
  border-color: var(--ink);
}

.lc-gates {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font: 600 var(--step-0) / 1.4 var(--font-num);
}

.lc-out {
  font-weight: 800;
}

.lc-op {
  padding: 1px 8px;
  border-radius: 6px;
  background: var(--cell);
  font-weight: 800;
}

.lc-question {
  margin: 0;
  font-weight: 700;
  text-align: center;
}

/* Dizi Dedektifi */
.sd-seq {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  max-width: 100%;
}

.sd-term {
  display: grid;
  place-items: center;
  min-width: 56px;
  min-height: 56px;
  padding: 4px 8px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
}

.sd-num {
  font: 700 var(--step-1) / 1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.sd-missing {
  border: 2px dashed var(--ink);
  background: var(--highlight);
  color: var(--highlight-ink);
  font: 800 var(--step-1) / 1 var(--font-display);
}

.choice .sd-term {
  border: 0;
  background: transparent;
}

/* Kelime Kutuları */
.ws-word {
  font: 800 clamp(1.8rem, 8vw, 3rem) / 1.1 var(--font-display);
  padding: 16px 24px;
  background: var(--surface);
  border-bottom: 4px solid var(--highlight);
  text-align: center;
  overflow-wrap: anywhere;
}

.ws-bin {
  font: 700 var(--step-1) / 1.2 var(--font-display);
  overflow-wrap: anywhere;
}

/* Döndür ya da Aynala */
.piece-bg {
  fill: var(--cell);
}

.piece-cell {
  fill: var(--primary);
}

svg.piece {
  display: block;
  max-width: 100%;
  height: auto;
}

.mg-ready {
  margin-top: 4px;
}

/* ---------- Sonuç ---------- */
.result {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.result-score {
  display: flex;
  flex-direction: column;
  font: 800 clamp(3rem, 16vw, 5.5rem) / 1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.result-score small {
  font: 700 var(--step--1) / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.badge {
  align-self: flex-start;
  margin: 0;
  padding: 6px 12px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: var(--surface);
  font-weight: 700;
}

.badge-record {
  background: var(--highlight);
  color: var(--highlight-ink);
  border-color: var(--ink);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  margin: 0;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.stat-grid > div {
  padding: 12px 14px;
  background: var(--surface);
}

.stat-grid.three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.pill {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--highlight);
  color: var(--highlight-ink);
  font: 700 0.7rem / 1.4 var(--font-body);
  vertical-align: middle;
}

/* ---------- İstatistik ---------- */
.panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  min-width: 0;
}

.week-chart {
  width: 100%;
  max-width: 480px;
  height: auto;
}

.week-chart .axis {
  stroke: var(--line);
  stroke-width: 1;
}

.week-chart .bar {
  fill: var(--primary);
  opacity: 0.55;
}

.week-chart .bar-today {
  opacity: 1;
}

.week-chart .bar-val,
.week-chart .bar-label {
  fill: var(--muted);
  font: 600 11px var(--font-body);
}

.week-chart .bar-val {
  fill: var(--ink);
}

.bars {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bars li {
  display: grid;
  grid-template-columns: minmax(0, 9rem) 1fr 5.5rem;
  align-items: center;
  gap: 10px;
}

.bar-track {
  height: 12px;
  border-radius: 6px;
  background: var(--cell);
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  background: var(--primary);
}

.bar-num {
  text-align: right;
  font: 600 var(--step--1) / 1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.table-wrap {
  overflow-x: auto;
  max-width: 100%;
}

table.data {
  border-collapse: collapse;
  width: 100%;
  font-size: var(--step--1);
}

table.data th,
table.data td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}

table.data td:last-child {
  white-space: normal;
}

table.data thead th {
  font: 700 0.7rem / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

table.data .num {
  text-align: right;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.spark-line {
  stroke: var(--primary);
  stroke-width: 2;
  fill: none;
}

.spark-dot {
  fill: var(--primary);
}

/* ---------- Ayarlar ---------- */
.form .field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form label {
  font-weight: 600;
}

.switch {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  cursor: pointer;
}

.switch input {
  width: 22px;
  height: 22px;
  accent-color: var(--primary);
}

.form select,
.form input[type='text'],
.export-box {
  min-height: 44px;
  padding: 8px 10px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  max-width: 100%;
}

.export-box {
  width: 100%;
  font: 0.8rem / 1.4 var(--font-num);
}

.import-confirm {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  background: var(--paper);
}

.hint.warn {
  color: var(--bad);
}

.row-actions.wrap .btn {
  flex: 0 1 auto;
}

/* ---------- Hareket ---------- */
@keyframes pop {
  from {
    transform: scale(1.4);
    opacity: 0.2;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.reduce-motion *:not(.dd-ball):not(.fa-alien),
.reduce-motion *::before,
.reduce-motion *::after {
  animation: none !important;
  transition: none !important;
}

@media (prefers-reduced-motion: reduce) {
  html:not(.motion-ok) *:not(.dd-ball):not(.fa-alien),
  html:not(.motion-ok) *::before,
  html:not(.motion-ok) *::after {
    animation-duration: 1ms !important;
    transition-duration: 1ms !important;
  }
}

/* ---------- Dar ekran ---------- */
@media (max-width: 480px) {
  .hud {
    grid-template-columns: auto 1fr 1fr 1.3fr;
    gap: 6px;
  }
  .stat-grid.three {
    grid-template-columns: 1fr;
  }
  .bars li {
    grid-template-columns: 1fr 5.5rem;
  }
  .bars .bar-track {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .df-panel {
    min-height: 130px;
  }
  .df-number {
    font-size: 3.6rem;
  }
  .choice {
    min-height: 64px;
  }
  .game-row {
    grid-template-columns: 44px 1fr auto;
    gap: 10px;
  }
}

/* Çok dar ekran: üst çubukta yalnızca logo ve gezinme */
@media (max-width: 460px) {
  .brand-name {
    display: none;
  }
  .nav-btn {
    padding: 0 9px;
  }
}

/* Yatay telefon: göstergeler solda, sahne sağda */
@media (max-height: 480px) and (orientation: landscape) {
  .screen {
    padding-block: 12px 24px;
    gap: 12px;
    max-width: 960px;
  }
  .topbar-inner {
    max-width: 960px;
    padding-block: 2px;
  }
  .play {
    display: grid;
    grid-template-columns: minmax(200px, 34%) minmax(0, 1fr);
    grid-auto-flow: dense;
    align-items: start;
    column-gap: 20px;
  }
  .play > :not(.stage):not(.pause-layer) {
    grid-column: 1;
  }
  .play > .stage {
    grid-column: 2;
    grid-row: 1 / span 8;
    min-height: 0;
  }
  .hud {
    grid-template-columns: auto 1fr 1fr;
  }
  .hud-score {
    grid-column: 1 / -1;
    flex-direction: row;
    justify-content: space-between;
    align-items: baseline;
  }
  .status {
    text-align: left;
    font-size: var(--step-0);
  }
  .df-panel {
    min-height: 100px;
  }
  .mg-grid {
    width: min(100%, 300px);
  }
}

/* =====================================================================
   Beyin Testi (ana sayfa, adımlar, final tartısı, kupalar)
   ===================================================================== */
:root {
  --cat-memory: #8e5bd6;
  --cat-logic: #2f7ae5;
  --cat-numeric: #e0701f;
  --cat-visual: #1f9d63;
}

.btn-lg {
  min-height: 56px;
  padding: 0 28px;
  font-size: var(--step-1);
}

.bt-window {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: end;
  gap: 8px 20px;
  padding: 24px 24px 0;
  border-radius: 18px;
  overflow: hidden;
  border: 2px solid var(--ink);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 100%);
}

.bt-sky {
  position: absolute;
  inset: auto 0 0 0;
  height: 42%;
  background:
    linear-gradient(transparent 70%, var(--lab) 70%),
    repeating-linear-gradient(90deg, transparent 0 18px, color-mix(in srgb, var(--lab) 55%, transparent) 18px 40px, transparent 40px 64px);
  opacity: 0.35;
  pointer-events: none;
}

.bt-host {
  position: relative;
  align-self: end;
}

.bt-hero-text {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 22px;
  min-width: 0;
}

.speech {
  position: relative;
  margin: 0;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--ink);
  font-weight: 600;
  max-width: 46ch;
}

.speech-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
}

.speech-row .speech::before {
  content: '';
  position: absolute;
  left: -10px;
  bottom: 14px;
  border: 8px solid transparent;
  border-right-color: var(--ink);
}

.bt-title {
  font-size: clamp(2rem, 8vw, 3.2rem);
  font-weight: 800;
  color: var(--ink);
}

.bt-record {
  margin: 0;
  font-size: var(--step-1);
  color: var(--ink);
}

.bt-record strong {
  font-family: var(--font-num);
}

.bt-sub {
  margin: 0;
  color: var(--ink);
  opacity: 0.85;
  font-size: var(--step--1);
}

.bt-cats {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bt-cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}

.bt-cat {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 6px solid var(--cat, var(--primary));
  border-radius: var(--radius);
  min-width: 0;
}

.cat-memory { --cat: var(--cat-memory); }
.cat-logic { --cat: var(--cat-logic); }
.cat-numeric { --cat: var(--cat-numeric); }
.cat-visual { --cat: var(--cat-visual); }

.bt-cat-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bt-cat-head h3 {
  font-size: var(--step-1);
}

.bt-cat-icon {
  font: 700 1.2rem / 1 var(--font-display);
}

.bt-games,
.bt-cat-best {
  margin: 0;
}

.bt-games {
  padding: 0;
  list-style: none;
  font-weight: 700;
}

.bt-cat-best {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-num);
}

.bt-choice {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.bt-choice select {
  min-height: 40px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  max-width: 100%;
}

.bt-training {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.bt-progress {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.bt-progress li {
  display: flex;
  flex-direction: column;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  min-width: 0;
}

.bt-progress li.is-current {
  border: 2px solid var(--ink);
  background: var(--highlight);
  color: var(--highlight-ink);
}

.bt-progress li.is-done {
  border-color: var(--good);
}

.bt-progress-name {
  font: 700 var(--step--1) / 1.2 var(--font-display);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bt-progress-val {
  font: 600 0.78rem / 1.2 var(--font-num);
}

.bt-step,
.bt-final {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.bt-grams {
  font: 800 clamp(3rem, 15vw, 5rem) / 1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.bt-weigh {
  display: grid;
  grid-template-columns: minmax(120px, 220px) minmax(0, 1fr);
  align-items: center;
  gap: 16px;
}

.bt-scale {
  width: 100%;
  height: auto;
}

.bt-total {
  display: flex;
  flex-direction: column;
  font: 800 clamp(2.8rem, 13vw, 5rem) / 1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.bt-total small {
  font: 700 var(--step--1) / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.bt-breakdown {
  margin: 0;
  padding: 16px;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.bt-breakdown li {
  display: grid;
  grid-template-columns: minmax(0, 9rem) 1fr 5.5rem;
  align-items: center;
  gap: 10px;
}

.bt-breakdown small {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
}

.bar-fill.cat-memory,
.bar-fill.cat-logic,
.bar-fill.cat-numeric,
.bar-fill.cat-visual {
  background: var(--cat);
}

.bt-trend {
  display: flex;
  align-items: center;
  gap: 12px;
}

ul.plain {
  margin: 0;
  padding-left: 20px;
}

.trophy-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.trophy {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px;
  border-radius: var(--radius);
  border: 1px dashed var(--line);
  background: var(--surface);
}

.trophy.is-earned {
  border: 2px solid var(--ink);
  background: var(--highlight);
  color: var(--highlight-ink);
}

.trophy.is-earned .muted {
  color: var(--highlight-ink);
}

.trophy-icon {
  font-size: 1.8rem;
}

.trophy-state {
  font-size: var(--step--1);
  font-weight: 600;
}


.test-step-label {
  margin: 0;
  font: 700 var(--step--1) / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.feedback.is-flash {
  min-height: 2.4rem;
  padding: 4px 10px;
}

.fb-inline {
  font-size: var(--step--1);
  color: var(--ink);
}

.fb-bonus {
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--highlight);
  color: var(--highlight-ink);
}

/* Profesör Gram */
.mascot {
  display: block;
  max-width: 100%;
  height: auto;
}

.pg-coat { fill: var(--coat); stroke: var(--ink); stroke-width: 2; }
.pg-lapel { fill: none; stroke: var(--gear); stroke-width: 2; }
.pg-pen { fill: var(--cat-logic); }
.pg-arm { fill: none; stroke: var(--brain-line); stroke-width: 6; stroke-linecap: round; }
.pg-tube { fill: var(--coat); stroke: var(--ink); stroke-width: 2; }
.pg-liquid { fill: var(--tube); }
.pg-brain circle { fill: var(--brain); stroke: var(--brain-line); stroke-width: 2.5; }
.pg-fold { fill: none; stroke: var(--brain-line); stroke-width: 2.5; stroke-linecap: round; }
.pg-glass { fill: color-mix(in srgb, var(--coat) 55%, transparent); stroke: #2a1733; stroke-width: 2.5; }
.pg-eye { fill: #2a1733; }
.pg-line { fill: none; stroke: #2a1733; stroke-width: 2.5; stroke-linecap: round; }
.pg-mouth { fill: #2a1733; }

.sc-base { fill: var(--lab); }
.sc-post { fill: var(--gear); }
.sc-plate { fill: var(--highlight); stroke: var(--ink); stroke-width: 2; }
.sc-brain circle { fill: var(--brain); stroke: var(--brain-line); stroke-width: 2.5; }
.sc-fold { fill: none; stroke: var(--brain-line); stroke-width: 2.5; }

/* Duraklatınca oyun animasyonları durur */
.stage.is-paused *,
.stage.is-paused {
  animation-play-state: paused !important;
}

/* =====================================================================
   Beyin Testi oyunları
   ===================================================================== */

/* Deseni Vur */
.ps-grid {
  display: grid;
  grid-template-columns: repeat(var(--n), minmax(0, 1fr));
  gap: 6px;
  width: min(100%, 420px);
  padding: 10px;
  border-radius: 14px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--tube) 35%, var(--surface)), var(--surface));
  border: 2px solid var(--ink);
  transform: perspective(700px) rotateX(10deg);
}

.ps-cell {
  aspect-ratio: 1;
  max-width: 100%;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 2px solid var(--line);
  background: var(--cell);
  cursor: pointer;
  font-size: clamp(1.1rem, 5vw, 1.8rem);
  padding: 0;
}

.ps-grid.is-hidden .ps-obj {
  visibility: hidden;
}

.ps-grid.is-revealed .ps-obj {
  visibility: visible;
  opacity: 0.75;
}

.ps-cell.is-ok {
  background: var(--good-bg);
  border-color: var(--good);
  box-shadow: inset 0 0 0 3px var(--good);
}

.ps-cell.is-wrong {
  background: var(--bad-bg);
  border-color: var(--bad);

.ps-cell.is-missed {

.ms-board {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  min-height: 120px;
  max-width: 460px;
  padding: 14px;
  border-radius: 14px;
  background: var(--surface);
  border: 2px solid var(--ink);
}

.ms-board.is-second {
  border-style: dashed;
}

.ms-obj {
  font-size: clamp(1.8rem, 8vw, 2.6rem);

}

/* Dişli Çark */
.gw-machine {
  width: 100%;
  max-width: 520px;
  padding: 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, var(--cell), var(--surface));
  border: 2px solid var(--ink);
}

.gw-gear {
  width: 100%;
  max-width: 120px;
  height: auto;
}

.gw-body { fill: var(--gear); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.gw-hub { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }

.gw-spin {
  transform-box: view-box;
  transform-origin: 50px 50px;
  animation: gw-rot linear infinite;
}

@keyframes gw-rot {
  to { transform: rotate(360deg); }
}

/* ABC Sırala */
.as-field {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(3, auto);
  gap: 10px;
  width: min(100%, 420px);
}

.as-letter {
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  font: 800 clamp(1.4rem, 7vw, 2.2rem) / 1 var(--font-display);
  cursor: pointer;
}

.as-letter.is-ok {
  background: var(--good-bg);
  border-color: var(--good);
  color: var(--good);
}

.as-letter.is-wrong {
  background: var(--bad-bg);
  border-color: var(--bad);
  color: var(--bad);
}

/* Düşürme! */
.dd-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 190px;
  gap: 14px;
  width: 100%;
}

.dd-play {
  position: relative;
  height: 340px;
  overflow: hidden;
  border-radius: 14px;
  border: 2px solid var(--ink);
  background: linear-gradient(180deg, var(--sky-top), var(--sky-low));
}

.dd-sky {
  position: absolute;
  inset: 0;
}

.dd-ground {
  position: absolute;
  inset: auto 0 0 0;
  height: 16px;
  background: var(--lab);
}

.dd-ball {
  position: absolute;
  top: -70px;
  width: 22%;
  min-width: 64px;
  max-width: 96px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff9b8a, #d23b2b 70%);
  color: #ffffff;
  border: 2px solid #5a1410;
  font: 800 clamp(0.95rem, 3.6vw, 1.25rem) / 1 var(--font-num);
  animation: dd-fall linear forwards;
}

@keyframes dd-fall {
  from { top: -70px; }
  to { top: calc(100% - 80px); }
}

.dd-ball.is-popped {
  animation-play-state: paused;
  transform: scale(1.4);
  opacity: 0;
  transition: transform 0.2s, opacity 0.2s;
}

.dd-ball.is-dropped {
  animation-play-state: paused;
  background: var(--gear);
  border-color: var(--ink);
  opacity: 0.6;
}

.dd-side {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dd-display {
  display: block;

.dd-display.is-wrong {

  border-color: var(--bad);
}

.dd-keypad {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));

.dd-key {

.nh-num[aria-pressed='true'] {

/* Uzaylıyı Dondur */
.fa-target {
  display: flex;

.fa-eye { fill: #ffffff; stroke: #2a1733; stroke-width: 1.5; }

.bb-field {

.bb-bubble[data-n]::after {

@media (max-width: 560px) {

            h('div', {}, h('dt', {}, 'Rekor'), h('dd', {}, rec?.best ? fmtInt(rec.best.score) : '—')),
          ),
          firstTime ? h('p', { class: 'note' }, 'İlk oynayışın: önce puanlanmayan bir alıştırma turu var.') : null,
          h(
            'div',
            { class: 'row-actions' },
            h('button', {
              type: 'button',
              class: 'btn btn-primary',
              id: 'start-game',
              onclick: () => play(id, { options, challenge, practiceRounds: firstTime ? 1 : 0, level }),
            }, 'Başla'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: challenge ? () => abandonChallenge(challenge) : menu }, challenge ? 'Mücadeleyi bırak' : 'Geri'),
          ),
        ),
      );
      const start = el.querySelector('#start-game');
      setTimeout(() => start.focus(), 0);
    });
  }

  // ---------------- Oyun ----------------
  // test: Beyin Testi adımı { durationMs, scoring, bonusEvery, bonusMs, label, onFinish(result), onQuit() }
  function play(id, { options = {}, challenge = null, practiceRounds = 0, level = 1, test = null }) {
    const game = gameById(id);
    const d = game.definition;
    const settings = repo.settings;
    // Sürekli akan oyunlar tur saymaz; bu yüzden "süre baskısı kapalı" modunda da süreli oynanır
    const relaxed = settings.relaxed && !challenge && !test && !d.continuous;
    const seed = settings.seed ? `${settings.seed}:${id}` : `${Date.now()}:${Math.random()}`;
    const rng = createRng(seed);
    const unit = test ? ' g' : '';
    const playClock = createTimer({ durationMs: Infinity, now: () => performance.now() });
    playClock.start();
    const now = () => playClock.elapsed();
    const rec = repo.data.games[id];
    const session = createSession({
      game,
      rng,
      startLevel: level,
      // Beyin Testi'nde oyunlar her zaman kolaydan başlayıp zorlaşır
      adaptive: test ? true : settings.adaptive,
      durationMs: test ? test.durationMs : challenge ? challenge.step.durationMs : relaxed ? Infinity : settings.durationSec * 1000,
      scoring: test?.scoring,
      bonusEvery: test?.bonusEvery || 0,
      bonusMs: test?.bonusMs,
      rounds: RELAXED_ROUNDS,
      practiceRounds,
      options,
      best: rec?.best || null,
      now,
    });

    show((el) => {
      let raf = 0;
      let disposed = false;
      let scheduled = [];
      let keyHandlers = [];
      let roundLimit = null;
      let answered = false;
      let finished = false;

      const hudScore = h('span', { class: 'hud-val', id: 'hud-score' }, '0');
      const hudLevel = h('span', { class: 'hud-val' }, String(level));
      const hudStreak = h('span', { class: 'hud-val' }, '0');
      const timeText = h('span', { class: 'time-text', 'aria-hidden': 'true' }, '');
      const timeFill = h('span', { class: 'time-fill' });
      const roundFill = h('span', { class: 'round-fill' });
      const status = h('p', { class: 'status', 'aria-live': 'polite' }, '');
      const stage = h('div', { class: 'stage', id: 'stage' });
      const feedback = h('div', { class: 'feedback', role: 'status', 'aria-live': 'assertive' });
      // null/false çocukları atlayan ekleme (yerel append bunları "null" metnine çevirir)
      const fbAppend = (...nodes) => append(feedback, nodes);
      const banner = h('p', { class: 'banner', hidden: true });
      const pauseBtn = h('button', { type: 'button', class: 'btn btn-ghost btn-sm', id: 'pause', onclick: () => togglePause() }, 'Duraklat');
      const pauseLayer = h(
        'div',
        { class: 'pause-layer', hidden: true, role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'pause-h' },
        h('h2', { id: 'pause-h' }, 'Duraklatıldı'),
        h('div', { class: 'row-actions' },
          h('button', { type: 'button', class: 'btn btn-primary', id: 'resume', onclick: () => togglePause() }, 'Devam et'),
          h('button', { type: 'button', class: 'btn btn-ghost', id: 'quit', onclick: () => finish(true) }, test ? 'Testi bırak' : 'Oyunu bitir'),
        ),
      );

      el.append(
        h(
          'section',
          { class: 'play', 'aria-label': d.name },
          h(
            'div',
            { class: 'hud' },
            pauseBtn,
            h('span', { class: 'hud-item' }, h('small', {}, 'Seviye'), hudLevel),
            h('span', { class: 'hud-item' }, h('small', {}, 'Seri'), hudStreak),
            h('span', { class: 'hud-item hud-score' }, h('small', {}, test ? 'Gram' : 'Skor'), hudScore),
          ),
          h(
            'div',
            {
              class: `timebar${session.timed ? '' : ' is-rounds'}`,
              role: 'progressbar',
              'aria-label': session.timed ? 'Kalan süre' : 'Tur ilerlemesi',
              'aria-valuemin': 0,
              'aria-valuemax': 100,
            },
            timeFill,
            timeText,
          ),
          h('div', { class: 'roundbar', 'aria-hidden': 'true' }, roundFill),
          banner,
          test ? h('p', { class: 'test-step-label' }, test.label) : null,
          h('h1', { class: 'visually-hidden' }, d.name),
          status,
          stage,
          feedback,
          pauseLayer,
        ),
      );

      const later = (fn, ms) => scheduled.push({ at: now() + ms, fn });

      const onKey = (e) => {
        if (e.key === 'Escape') {
          togglePause();
          e.preventDefault();
          return;
        }
        if (paused) return;
        for (const handler of keyHandlers) {
          if (handler(e)) {
            e.preventDefault();
            return;
          }
        }
      };
      document.addEventListener('keydown', onKey);

      let paused = false;
      function togglePause() {
        if (finished) return;
        paused = !paused;
        if (!paused) {
          session.resume();
          playClock.resume();
          pauseLayer.hidden = true;
          stage.inert = false;
          stage.classList.remove('is-paused');
          pauseBtn.focus();
        } else {
          session.pause();
          playClock.pause();
          pauseLayer.hidden = false;
          stage.inert = true;
          stage.classList.add('is-paused');
          pauseLayer.querySelector('#resume').focus();
        }
      }

      function updateHud() {
        hudScore.textContent = fmtInt(session.score) + unit;
        hudLevel.textContent = String(session.level);
        hudStreak.textContent = String(session.streak);
      }

      function tick() {
        if (disposed) return;
        raf = requestAnimationFrame(tick);
        const t = now();
        // zamanlanmış işler (duraklatmaya duyarlı saat)
        if (scheduled.length) {
          const due = scheduled.filter((j) => j.at <= t);
          scheduled = scheduled.filter((j) => j.at > t);
          due.forEach((j) => j.fn());
        }
        if (session.timed && !session.practice) {
          const frac = session.timer.fraction();
          timeFill.style.transform = `scaleX(${frac})`;
          const secs = Math.ceil(session.timer.remaining() / 1000);
          timeText.textContent = `${secs} sn`;
          timeFill.parentElement.setAttribute('aria-valuenow', String(Math.round(frac * 100)));
          timeFill.parentElement.classList.toggle('is-low', secs <= 10);
          if (session.timer.expired() && (session.phase === PHASE.AWAITING || session.phase === PHASE.PRESENTING)) {
            finish(false);
            return;
          }
        } else if (!session.timed) {
          const frac = Math.min(1, session.roundNumber / RELAXED_ROUNDS);
          timeFill.style.transform = `scaleX(${frac})`;
          timeText.textContent = `${session.roundNumber}/${RELAXED_ROUNDS}`;
        } else {
          timeText.textContent = 'Alıştırma';
        }
        if (roundLimit) {
          roundFill.style.transform = `scaleX(${roundLimit.timer.fraction()})`;
          if (roundLimit.timer.expired()) {
            const map = roundLimit.map;
            roundLimit = null;
            answer(map ? map() : { timeout: true });
          }
        }
      }

      function newRound() {
        const round = session.nextRound();
        if (!round) finish(false);
        else renderRound(round);
      }

      function renderRound(round) {
        scheduled = [];
        keyHandlers = [];
        roundLimit = null;
        roundFill.style.transform = 'scaleX(0)';
        answered = false;
        feedback.className = 'feedback';
        clear(feedback);
        clear(stage);
        banner.hidden = !session.practice;
        banner.textContent = session.practice ? 'ALIŞTIRMA TURU · puan sayılmaz, süre işlemez' : '';
        updateHud();
        game.render({
          root: stage,
          round,
          level: session.level,
          practice: session.practice,
          relaxed,
          reducedMotion: reducedMotion(),
          answer,
          presented: () => session.phase === PHASE.PRESENTING && session.presented(),
          later,
          onKey: (fn) => keyHandlers.push(fn),
          status: (text) => (status.textContent = text),
          sound: (name) => audio.play(name),
          limit: (ms, map) => {
            roundLimit = { timer: createTimer({ durationMs: ms, now }), map };
            roundLimit.timer.start();
          },
          // sürekli akan oyunlar için
          currentLevel: () => session.level,
          rng,
          now,
          record: recordEvent,
        });
      }

      // Sürekli oyunlarda tek olay: tur bitmez, kısa geri bildirim verilir.
      function recordEvent(input) {
        if (finished || paused || session.phase !== PHASE.AWAITING) return null;
        const res = session.record(input);
        updateHud();
        const ok = res.outcome === OUTCOME.CORRECT;
        if (res.outcome !== OUTCOME.IGNORE) {
          feedback.className = `feedback is-flash ${ok ? 'is-ok' : 'is-bad'}`;
          clear(feedback);
          fbAppend(
            h('span', { class: 'fb-icon', 'aria-hidden': 'true' }, ok ? '✓' : '✕'),
            h('span', { class: 'fb-pts' }, `${res.points >= 0 ? '+' : ''}${res.points}${unit}`),
            !ok && res.explanation ? h('span', { class: 'fb-inline' }, res.explanation) : null,
            res.bonusTime ? h('strong', { class: 'fb-bonus' }, `+${res.bonusTime / 1000} sn ek süre!`) : null,
          );
          audio.play(ok ? 'tick' : 'wrong');
          if (res.bonusTime) audio.play('level');
        }
        if (res.levelChange.changed) announce(`Seviye ${res.levelChange.level}`);
        return res;
      }

      function answer(input) {
        if (answered || finished || paused) return;
        answered = true;
        roundLimit = null;
        const res = session.submit(input);
        updateHud();
        const ok = res.outcome === OUTCOME.CORRECT;
        const ignore = res.outcome === OUTCOME.IGNORE;
        const label = {
          [OUTCOME.CORRECT]: 'Doğru',
          [OUTCOME.WRONG]: 'Yanlış',
          [OUTCOME.FALSE_ALARM]: 'Yanlış alarm',
          [OUTCOME.MISS]: 'Kaçırdın',
          [OUTCOME.TIMEOUT]: 'Süre doldu',
          [OUTCOME.SKIP]: 'Boş geçildi',
        }[res.outcome];
        if (!ignore) {
          feedback.className = `feedback ${ok ? 'is-ok' : 'is-bad'}`;
          clear(feedback);
          fbAppend(
            h('span', { class: 'fb-icon', 'aria-hidden': 'true' }, ok ? '✓' : '✕'),
            h('strong', {}, label),
            res.practice ? h('span', { class: 'fb-pts' }, 'alıştırma') : h('span', { class: 'fb-pts' }, `${res.points >= 0 ? '+' : ''}${res.points}${unit}`),
            res.bonusTime ? h('strong', { class: 'fb-bonus' }, `+${res.bonusTime / 1000} sn ek süre!`) : null,
            res.quickSwitch ? h('span', { class: 'fb-note' }, 'Kural değişimini hemen fark ettin!') : null,
            !ok && res.explanation ? h('span', { class: 'fb-note' }, res.explanation) : null,
          );
          audio.play(ok ? 'correct' : 'wrong');
        }
        if (res.levelChange.changed) {
          const up = res.levelChange.changed > 0;
          const toast = h('span', { class: `fb-level ${up ? 'up' : 'down'}` }, `Seviye ${res.levelChange.level} ${up ? '↑' : '↓'} · ${res.levelChange.reason}`);
          fbAppend(toast);
          if (up) audio.play('level');
          announce(toast.textContent);
        }
        const practiceDone = res.practice && !session.practice;
        if (practiceDone) fbAppend(h('span', { class: 'fb-note' }, 'Alıştırma bitti. Şimdi gerçek oyun başlıyor!'));
        const long = !ok && res.explanation;
        const delay = ignore ? 220 : practiceDone ? 1800 : long ? (res.steps ? 2800 : 1700) : ok ? 520 : 900;
        if (relaxed && long) {
          const cont = h('button', { type: 'button', class: 'btn btn-secondary btn-sm', id: 'continue', onclick: () => newRound() }, 'Devam');
          fbAppend(cont);
          keyHandlers = [(e) => (e.key === 'Enter' ? (cont.click(), true) : false)];
          cont.focus();
        } else {
          later(() => {
            if (!finished) newRound();
          }, delay);
        }
      }

      function finish(quit) {
        if (finished) return;
        finished = true;
        session.end();
        const result = session.result();
        if (test && quit) {
          cleanup();
          test.onQuit();
          return;
        }
        if (quit && result.answered === 0) {
          cleanup();
          if (challenge) abandonChallenge(challenge);
          else intro(id);
          return;
        }
        repo.markTutorialSeen(id);
        const previousBest = repo.recordResult(result, { category: d.category });
        audio.play('end');
        cleanup();
        if (test) test.onFinish(result);
        else if (challenge) challengeNext(challenge, result);
        else resultScreen(result, previousBest);
      }

      function cleanup() {
        disposed = true;
        cancelAnimationFrame(raf);
        document.removeEventListener('keydown', onKey);
      }

      // 3-2-1 geri sayım, sonra ilk tur
      const count = h('div', { class: 'countdown', 'aria-live': 'assertive' });
      stage.append(count);
      const steps = reducedMotion() ? ['Hazır'] : ['3', '2', '1'];
      steps.forEach((txt, i) =>
        later(() => {
          count.textContent = txt;
          audio.play('count');
        }, i * 650),
      );
      later(() => {
        audio.play('start');
        renderRound(session.start());
      }, steps.length * 650);
      raf = requestAnimationFrame(tick);

      return () => {
        if (!finished) {
          finished = true;
          session.end();
        }
        cleanup();
      };
    });
  }

  // ---------------- Sonuç ----------------
  function resultRows(r) {
    return [
      ['Doğruluk', fmtPct(r.accuracy), r.records.accuracy],
      ['Doğru / Yanlış', `${r.counts.correct} / ${r.answered - r.counts.correct}`],
      ['Ort. tepki süresi', fmtMs(r.avgRtMs), r.records.avgRtMs],
      ['Süre', fmtMs(r.durationMs)],
      ['En uzun seri', String(r.bestStreak)],
      ['Ulaşılan seviye', `${r.maxLevel}`],
    ];
  }

  function resultScreen(result, previousBest) {
    const d = gameById(result.gameId).definition;
    show((el) => {
      const isRecord = result.records.score;
      const errors = [
        ['Yanlış', result.counts.wrong],
        ['Yanlış alarm', result.counts.falseAlarm],
        ['Kaçırılan', result.counts.miss],
        ['Süre aşımı', result.counts.timeout],
        ['Boş', result.counts.skip],
      ].filter(([, n]) => n > 0);
      el.append(
        h(
          'section',
          { class: 'result' },
          h('p', { class: 'eyebrow' }, d.name),
          h('h1', { class: 'result-score' }, h('small', {}, 'Skor'), fmtInt(result.score)),
          isRecord
            ? h('p', { class: 'badge badge-record' }, previousBest ? `Yeni rekor! Öncekinden ${fmtInt(result.score - previousBest.score)} fazla.` : 'İlk rekorun!')
            : result.toBest > 0
              ? h('p', { class: 'badge' }, `Rekoruna ${fmtInt(result.toBest)} puan kaldı (${fmtInt(previousBest?.score)}).`)
              : null,
          h(
            'dl',
            { class: 'stat-grid' },
            resultRows(result).map(([k, v, rec]) => h('div', {}, h('dt', {}, k), h('dd', {}, v, rec ? h('span', { class: 'pill' }, 'rekor') : null))),
          ),
          errors.length ? h('p', { class: 'muted' }, `Hata dağılımı: ${errors.map(([k, n]) => `${k} ${n}`).join(' · ')}`) : null,
          h(
            'div',
            { class: 'row-actions' },
            h('button', { type: 'button', class: 'btn btn-primary', id: 'again', onclick: () => intro(result.gameId) }, 'Tekrar oyna'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: menu }, 'Menü'),
          ),
        ),
      );
      setTimeout(() => el.querySelector('#again')?.focus(), 0);
    });
  }

  // ---------------- Uyarlanabilir Mücadele ----------------
  function challengeIntro() {
    const fixed = repo.settings.startLevel === 'auto' ? null : repo.settings.startLevel;
    const plan = planChallenge({
      games: GAMES,
      categories: CATEGORIES,
      data: repo.data,
      rng: createRng(repo.settings.seed ? `${repo.settings.seed}:challenge` : Date.now()),
      adaptive: repo.settings.adaptive,
      fixedLevel: fixed,
    });
    show((el) => {
      el.append(
        h(
          'section',
          { class: 'intro' },
          h('p', { class: 'eyebrow' }, `${plan.length} oyun · her biri ${plan[0].durationMs / 1000} sn`),
          h('h1', { class: 'intro-title' }, 'Uyarlanabilir Mücadele'),
          h(
            'p',
            {},
            repo.settings.adaptive
              ? 'Oyunlar geçmiş sonuçlarına göre seçildi: bir ısınma, gelişime açık alanların ve henüz denemediklerin. Zorluk; doğruluğuna, hızına ve son turlarına göre oyun içinde ayarlanır.'
              : 'Otomatik uyarlama ayarlardan kapalı. Oyunlar rastgele seçildi ve seviye sabit kalır.',
          ),
          h(
            'ol',
            { class: 'plan' },
            plan.map((step) =>
              h('li', {}, h('strong', {}, gameById(step.gameId).definition.name), h('span', { class: 'muted' }, ` · ${step.categoryName} · seviye ${step.startLevel}`), h('span', { class: 'reason' }, step.reason)),
            ),
          ),
          h(
            'div',
            { class: 'row-actions' },
            h('button', { type: 'button', class: 'btn btn-primary', id: 'start-challenge', onclick: () => challengeStep({ plan, index: 0, results: [] }) }, 'Mücadeleyi başlat'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: menu }, 'Geri'),
          ),
        ),
      );
      setTimeout(() => el.querySelector('#start-challenge')?.focus(), 0);
    });
  }

  function challengeStep(state) {
    const step = state.plan[state.index];
    intro(step.gameId, { challenge: { ...state, step } });
  }

  function challengeNext(challenge, result) {
    const results = [...challenge.results, result];
    const index = challenge.index + 1;
    if (index < challenge.plan.length) challengeStep({ plan: challenge.plan, index, results });
    else challengeSummary(challenge.plan, results);
  }

  function abandonChallenge(challenge) {
    if (challenge.results.length) challengeSummary(challenge.plan.slice(0, challenge.results.length), challenge.results);
    else menu();
  }

  function challengeSummary(plan, results) {
    const sum = summarizeChallenge(results);
    show((el) => {
      el.append(
        h(
          'section',
          { class: 'result' },
          h('p', { class: 'eyebrow' }, 'Uyarlanabilir Mücadele'),
          h('h1', { class: 'result-score' }, h('small', {}, 'Toplam skor'), fmtInt(sum.score)),
          h('p', { class: 'muted' }, `Toplam doğruluk ${fmtPct(sum.accuracy)} · ${sum.correct}/${sum.answered} doğru`),
          h(
            'div',
            { class: 'table-wrap' },
            h(
              'table',
              { class: 'data' },
              h('thead', {}, h('tr', {}, ['Oyun', 'Skor', 'Doğruluk', 'Seviye', 'Neden seçildi'].map((t) => h('th', { scope: 'col' }, t)))),
              h(
                'tbody',
                {},
                results.map((r, i) =>
                  h(
                    'tr',
                    {},
                    h('th', { scope: 'row' }, gameById(r.gameId).definition.name),
                    h('td', { class: 'num' }, fmtInt(r.score)),
                    h('td', { class: 'num' }, fmtPct(r.accuracy)),
                    h('td', { class: 'num' }, r.level === r.maxLevel ? String(r.level) : `${r.level} (en yüksek ${r.maxLevel})`),
                    h('td', {}, plan[i]?.reason || ''),
                  ),
                ),
              ),
            ),
          ),
          h(
            'div',
            { class: 'row-actions' },
            h('button', { type: 'button', class: 'btn btn-primary', id: 'again', onclick: challengeIntro }, 'Yeni mücadele'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: menu }, 'Menü'),
          ),
        ),
      );
    });
  }

  // ---------------- İstatistik ----------------
  function sparkline(values) {
    if (values.length < 2) return h('span', { class: 'muted' }, '—');
    const w = 96;
    const hgt = 28;
    const max = Math.max(...values, 1);
    const pts = values.map((v, i) => [(i / (values.length - 1)) * (w - 6) + 3, hgt - 3 - (v / max) * (hgt - 6)]);
    const line = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const last = pts[pts.length - 1];
    return s(
      'svg',
      { viewBox: `0 0 ${w} ${hgt}`, width: w, height: hgt, class: 'spark', role: 'img', 'aria-label': `Son ${values.length} skor: ${values.join(', ')}` },
      s('polyline', { points: line, class: 'spark-line', fill: 'none' }),
      s('circle', { cx: last[0], cy: last[1], r: 2.8, class: 'spark-dot' }),
    );
  }

  function weekChart(days) {
    const w = 320;
    const hgt = 120;
    const max = Math.max(...days.map((d) => d.count), 1);
    const bw = (w - 20) / days.length;
    const names = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
    return s(
      'svg',
      { viewBox: `0 0 ${w} ${hgt}`, class: 'week-chart', role: 'img', 'aria-label': `Son 7 gün oturum sayıları: ${days.map((d) => d.count).join(', ')}` },
      s('line', { x1: 10, x2: w - 10, y1: hgt - 22, y2: hgt - 22, class: 'axis' }),
      days.map((d, i) => {
        const bh = (d.count / max) * (hgt - 46);
        const x = 10 + i * bw + bw * 0.2;
        return s(
          'g',
          {},
          s('rect', { x, y: hgt - 22 - bh, width: bw * 0.6, height: Math.max(bh, d.count ? 2 : 0), rx: 3, class: i === days.length - 1 ? 'bar bar-today' : 'bar' }),
          d.count ? s('text', { x: x + bw * 0.3, y: hgt - 26 - bh, class: 'bar-val', 'text-anchor': 'middle' }, document.createTextNode(String(d.count))) : null,
          s('text', { x: x + bw * 0.3, y: hgt - 6, class: 'bar-label', 'text-anchor': 'middle' }, document.createTextNode(names[new Date(d.dayStart).getDay()])),
        );
      }),
    );
  }

  function brainPanel() {
    const b = repo.data.brain;
    const kg = (v) => (v ? `${Math.round(v).toLocaleString('tr-TR')} g` : '—');

      'section',
      { class: 'panel' },
      h('h2', { class: 'section-title' }, 'Beyin Testi'),
      h(
        'dl',
        { class: 'stat-grid' },
        h('div', {}, h('dt', {}, 'Test'), h('dd', {}, String(b.tests))),
        h('div', {}, h('dt', {}, 'Rekor beyin'), h('dd', {}, kg(b.best?.total))),
        TEST_CATEGORIES.map((c) => h('div', {}, h('dt', {}, `${c.name} en iyi`), h('dd', {}, kg(b.catBest[c.id])))),
      ),
      h('div', { class: 'bt-trend' }, h('span', { class: 'muted' }, 'Son testler'), sparkline(b.history.slice(-10).map((x) => x.total))),

  function statsScreen() {

          h(
            'div',
            { class: 'table-wrap' },
            h(
              'table',
              { class: 'data' },
              h('thead', {}, h('tr', {}, ['Oyun', 'Oynama', 'En iyi skor', 'En iyi doğruluk', 'En iyi tepki', 'Eğilim', 'Son skorlar'].map((t) => h('th', { scope: 'col' }, t)))),
              h(
                'tbody',
                {},

  // ---------------- Ayarlar ----------------
  function settingsScreen() {
    show((el) => {
      const st = repo.settings;
      const update = (patch) => {
        repo.updateSettings(patch);
        applySettings();
      };
      const toggle = (id, label, key, hint) =>
        h(
          'div',
          { class: 'field' },
          h('label', { class: 'switch', for: id },
            h('input', { type: 'checkbox', id, checked: st[key], onchange: (e) => update({ [key]: e.target.checked }) }),
            h('span', {}, label),
          ),
          hint ? h('p', { class: 'hint' }, hint) : null,
        );
      const select = (id, label, key, choices, parse = (v) => v) =>
        h(
          'div',
          { class: 'field' },
          h('label', { for: id }, label),
          h(
            'select',
            { id, onchange: (e) => update({ [key]: parse(e.target.value) }) },
            choices.map(([value, text]) => h('option', { value: String(value), selected: String(st[key]) === String(value) }, text)),

        );

          if (btn.dataset.armed) {
            action();
            return;
          }
          btn.dataset.armed = '1';
          btn.textContent = confirmText;
          setTimeout(() => {
            if (btn.isConnected) {
              delete btn.dataset.armed;
              btn.textContent = label;
            }
          }, 4000);
        });
        return btn;
      };
      const msg = h('p', { class: 'hint', 'aria-live': 'polite', id: 'data-msg' });

      const importConfirm = h('div', { class: 'import-confirm', hidden: true, role: 'group', 'aria-label': 'İçe aktarma onayı' });
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files?.[0];
        fileInput.value = '';
        importConfirm.hidden = true;
        clear(importConfirm);
        if (!file) return;
        try {
          if (file.size > MAX_IMPORT_BYTES) throw new Error('Dosya 1 MB’tan büyük');
          const text = await file.text();
          const preview = repo.previewImport(text);
          importConfirm.append(
            h('p', { class: 'hint' }, `Dosyada ${preview.games} oyun kaydı ve ${preview.sessions} oturum var. İçe aktarırsan şu anki ilerlemen bunlarla değiştirilir.`),
            h(
              'div',
              { class: 'row-actions wrap' },
              h('button', {
                type: 'button',
                class: 'btn btn-primary',
                id: 'import-confirm',
                onclick: () => {
                  repo.importJson(text);
                  applySettings();
                  importConfirm.hidden = true;
                  msg.textContent = 'Veriler içe aktarıldı.';
                },
              }, 'Mevcut verinin yerine yaz'),
              h('button', {
                type: 'button',
                class: 'btn btn-ghost',
                onclick: () => {
                  importConfirm.hidden = true;
                  msg.textContent = 'İçe aktarma iptal edildi. Verilerin değişmedi.';
                },
              }, 'Vazgeç'),
            ),
          );
          importConfirm.hidden = false;
          msg.textContent = '';
          importConfirm.querySelector('#import-confirm').focus();
        } catch (err) {
          msg.textContent = `İçe aktarılamadı: ${err.message}. Bu uygulamadan dışa aktarılmış bir JSON dosyası seç.`;
        }
      });

      el.append(
        h('h1', { class: 'page-title' }, 'Ayarlar'),
        h(
          'section',
          { class: 'panel form' },
          h('h2', { class: 'section-title' }, 'Oyun'),
          select('set-duration', 'Oturum süresi', 'durationSec', [[45, '45 saniye'], [60, '60 saniye'], [90, '90 saniye']], Number),
          toggle('set-relaxed', 'Süre baskısı kapalı', 'relaxed', `Oturumlar ${RELAXED_ROUNDS} tur sürer, geri sayım olmaz. Hafıza Izgarası’nda ezberleme süresini sen bitirirsin. Çift Odak’ta uyaranlar daha uzun kalır.`),
          toggle('set-adaptive', 'Otomatik zorluk', 'adaptive', 'Açıkken seviye; doğruluğuna, tepki süren ve son cevaplarına göre küçük adımlarla değişir. Kapalıyken başlangıç seviyesinde kalır.'),
          select('set-level', 'Başlangıç seviyesi', 'startLevel', [['auto', 'Otomatik (son seviyenin bir altı)'], ...Array.from({ length: 10 }, (_, i) => [i + 1, `Seviye ${i + 1}`])], (v) => (v === 'auto' ? 'auto' : Number(v))),
        ),
        h(
          'section',
          { class: 'panel form' },
          h('h2', { class: 'section-title' }, 'Görünüm ve ses'),
          h('div', { class: 'field' },
            h('label', { for: 'set-name' }, 'Adın'),
            h('input', { type: 'text', id: 'set-name', value: st.name, maxlength: 20, autocomplete: 'given-name', placeholder: 'Testten önce seni adınla karşılar', onchange: (e) => update({ name: e.target.value.trim() }) }),
          ),
          toggle('set-sound', 'Sesler', 'sound'),
          select('set-motion', 'Hareketler', 'reducedMotion', [['auto', 'Sistem ayarına uy'], ['on', 'Azalt'], ['off', 'Normal']]),
          select('set-theme', 'Tema', 'theme', [['auto', 'Sistem'], ['light', 'Açık'], ['dark', 'Koyu']]),
        ),
        h(
          'section',
          { class: 'panel form' },
          h('h2', { class: 'section-title' }, 'Veriler'),
          h('p', { class: 'hint' }, repo.persistent ? 'Tüm veriler yalnızca bu tarayıcıda saklanır; hiçbir yere gönderilmez.' : 'Bu tarayıcı yerel kaydı engelliyor; veriler sekme kapanınca silinir.'),
          repo.warnings.map((w) => h('p', { class: 'hint warn' }, w)),
          h(
            'div',
            { class: 'row-actions wrap' },
            h('button', {
              type: 'button',
              class: 'btn btn-secondary',
              id: 'export',
              onclick: () => {
                const json = repo.exportJson();
                exportBox.value = json;
                exportBox.hidden = false;
                exportBox.select();
                try {
                  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
                  const a = h('a', { href: url, download: 'zihin-molasi-veri.json' });
                  document.body.append(a);
                  a.click();
                  a.remove();
                  setTimeout(() => URL.revokeObjectURL(url), 1000);
                } catch {
                  /* indirme engellenmiş olabilir; metin kutusu yedek yoldur */
                }
                navigator.clipboard?.writeText(json).then(
                  () => (msg.textContent = 'Veri indirildi ve panoya kopyalandı. İndirme başlamadıysa aşağıdaki metni kopyala.'),
                  () => (msg.textContent = 'İndirme başlamadıysa aşağıdaki metni seçip kopyala.'),
                );
              },
            }, 'Dışa aktar'),
            h('button', { type: 'button', class: 'btn btn-secondary', id: 'import', onclick: () => fileInput.click() }, 'İçe aktar'),
            confirmBtn('reset-stats', 'İstatistikleri sıfırla', 'Emin misin? Tekrar bas', () => {
              repo.resetStats();
              msg.textContent = 'İstatistikler ve rekorlar sıfırlandı. Ayarlar korundu.';
            }),
            confirmBtn('delete-all', 'Tüm verileri sil', 'Her şey silinecek. Tekrar bas', () => {
              repo.deleteAll();
              applySettings();
              settingsScreen();
            }),
          ),
          fileInput,
          importConfirm,
          msg,
          exportBox,
        ),
        h(
          'section',
          { class: 'panel form' },
          h('h2', { class: 'section-title' }, 'Test'),
          h('div', { class: 'field' },
            h('label', { for: 'set-seed' }, 'Sabit tohum'),
            h('input', { type: 'text', id: 'set-seed', value: st.seed, maxlength: 40, placeholder: 'boş = her oyun farklı', onchange: (e) => update({ seed: e.target.value.trim() }) }),
            h('p', { class: 'hint' }, 'Bir değer girersen aynı oyun her seferinde aynı soruları üretir.'),
          ),
        ),
      );
    });
  }

  const brainScreens = createBrainScreens({ repo, show, play, audio, reducedMotion, openTraining: menu });

  return { menu: brainScreens.home, training: menu, trophies: brainScreens.trophies, intro, statsScreen, settingsScreen, applySettings };
}

return { createApp };
})();
