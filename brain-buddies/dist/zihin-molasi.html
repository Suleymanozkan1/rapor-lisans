<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zihin Molası</title>
    <meta name="description" content="Kısa turlu, çevrimdışı beyin egzersizi oyunu." />
    <style>
/* Zihin Molası — "test defteri": soğuk kareli kâğıt, mürekkep mavisi, fosforlu kalem sarısı.
   Düzen: tek sütun, en fazla 760px; oyun ekranında üstte gösterge, ortada sahne. */
:root {
  --paper: #eef2f7;
  --grid-line: #dde4ee;
  --surface: #ffffff;
  --ink: #18264a;
  --muted: #56648a;
  --line: #cdd6e4;
  --primary: #2a55c4;
  --primary-ink: #ffffff;
  --highlight: #ffd84a;
  --highlight-ink: #18264a;
  --good: #137a4c;
  --good-bg: #dff4e9;
  --bad: #bd3030;
  --bad-bg: #fbe3e3;
  --shape-bg: #ffffff;
  --cell: #e3e9f3;
  --cell-lit: #ffd84a;

  --font-display: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
  --step-4: 3rem;

  --radius: 10px;
  --tap: 48px;
  --dur: 160ms;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #0f1420;
    --grid-line: #172033;
    --surface: #172034;
    --ink: #e6ecf8;
    --muted: #a0aecb;
    --line: #2b3854;
    --primary: #7ea4ff;
    --primary-ink: #0f1420;
    --highlight: #ffd84a;
    --highlight-ink: #18264a;
    --good: #46d59a;
    --good-bg: #123526;
    --bad: #ff8080;
    --bad-bg: #3d1a1e;
    --shape-bg: #172034;
    --cell: #22304b;
    --cell-lit: #ffd84a;
    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --paper: #0f1420;
  --grid-line: #172033;
  --surface: #172034;
  --ink: #e6ecf8;
  --muted: #a0aecb;
  --line: #2b3854;
  --primary: #7ea4ff;
  --primary-ink: #0f1420;
  --highlight: #ffd84a;
  --highlight-ink: #18264a;
  --good: #46d59a;
  --good-bg: #123526;
  --bad: #ff8080;
  --bad-bg: #3d1a1e;
  --shape-bg: #172034;
  --cell: #22304b;
  --cell-lit: #ffd84a;
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: 2px;
}

h1,
h2,
h3 {
  font-family: var(--font-display);
  line-height: 1.15;
  text-wrap: balance;
  margin: 0;
}

/* ---------- Üst çubuk ---------- */
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--surface);
  border-bottom: 2px solid var(--ink);
}

.topbar-inner,
.screen {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: 0;
  color: var(--ink);
  font: 700 var(--step-1) / 1 var(--font-display);
  cursor: pointer;
  padding: 6px 0;
  min-height: var(--tap);
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--highlight);
  color: var(--highlight-ink);
  font-size: 0.9rem;
  letter-spacing: 0.04em;
  transform: rotate(-4deg);
}

.nav {
  display: flex;
  gap: 4px;
}

.nav-btn {
  min-height: var(--tap);
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--ink);
  font: 600 var(--step--1) / 1 var(--font-body);
  cursor: pointer;
}

.nav-btn:hover {
  background: var(--cell);
}

.screen {
  padding-block: 24px 48px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.screen:focus {
  outline: none;
}

/* ---------- Düğmeler ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 20px;
  border-radius: var(--radius);
  border: 2px solid var(--ink);
  font: 700 var(--step-0) / 1.1 var(--font-display);
  cursor: pointer;
  transition: transform var(--dur), box-shadow var(--dur), background var(--dur);
}

.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
  box-shadow: 0 3px 0 var(--ink);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 0 var(--ink);
}

.btn-primary:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--ink);
}

.btn-secondary {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 3px 0 var(--ink);
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}

.btn-danger {
  color: var(--bad);
  border-color: var(--bad);
}

.btn-sm {
  min-height: 40px;
  padding: 0 12px;
  font-size: var(--step--1);
}

.btn:disabled {
  opacity: 0.5;
  cursor: default;
}

.row-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ---------- Menü ---------- */
.hero {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-block: 8px;
}

.hero-title {
  font-size: clamp(var(--step-2), 7vw, var(--step-4));
  font-weight: 800;
  letter-spacing: -0.01em;
}

.hl {
  background: var(--highlight);
  color: var(--highlight-ink);
  padding: 0 0.15em;
  border-radius: 4px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

.hero-sub,
.muted,
.hint {
  color: var(--muted);
  margin: 0;
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.section-title {
  font-size: var(--step-1);
}

.page-title {
  font-size: var(--step-3);
}

.game-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.cat {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.cat-title {
  font: 700 var(--step--1) / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.game-row {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 64px;
  padding: 10px 14px;
  text-align: left;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  font: inherit;
  transition: border-color var(--dur), transform var(--dur);
}

.game-row:hover {
  border-color: var(--ink);
  transform: translateX(2px);
}

.game-icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: 2px solid var(--ink);
  font: 700 1.3rem / 1 var(--font-display);
}

.game-icon.big {
  display: inline-grid;
  width: 52px;
  height: 52px;
  margin-right: 12px;
  vertical-align: middle;
  background: var(--highlight);
  color: var(--highlight-ink);
}

.game-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.game-text strong {
  font-family: var(--font-display);
  font-size: var(--step-0);
}

.game-text span {
  color: var(--muted);
  font-size: var(--step--1);
}

.game-best {
  text-align: right;
  font: 700 var(--step-0) / 1.1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.game-best small {
  display: block;
  font: 600 0.7rem / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.note {
  margin: 0;
  padding: 10px 14px;
  border-left: 4px solid var(--highlight);
  background: var(--surface);
  color: var(--ink);
}

/* ---------- Tanıtım ---------- */
.intro {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.eyebrow {
  margin: 0;
  font: 700 var(--step--1) / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.intro-title {
  font-size: var(--step-3);
}

.intro p {
  margin: 0;
  max-width: 65ch;
}

.reason {
  display: block;
  color: var(--muted);
  font-size: var(--step--1);
}

.howto {
  margin: 0;
  padding: 16px 16px 16px 40px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 65ch;
}

.plan {
  margin: 0;
  padding-left: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.facts {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  margin: 0;
}

.facts dt,
.stat-grid dt {
  font: 600 0.72rem / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.facts dd,
.stat-grid dd {
  margin: 2px 0 0;
  font: 700 var(--step-1) / 1.2 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.seg {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.seg legend {
  font-weight: 700;
  margin-bottom: 6px;
  padding: 0;
}

.seg-item {
  position: relative;
}

.seg-item input {
  position: absolute;
  opacity: 0;
  inset: 0;
  margin: 0;
  cursor: pointer;
}

.seg-item span {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 16px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
}

.seg-item input:checked + span {
  border-color: var(--ink);
  background: var(--highlight);
  color: var(--highlight-ink);
}

.seg-item input:focus-visible + span {
  outline: 3px solid var(--primary);
  outline-offset: 2px;
}

/* ---------- Oyun ekranı ---------- */
.play {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.hud {
  display: grid;
  grid-template-columns: auto 1fr 1fr 1.4fr;
  align-items: center;
  gap: 10px;
}

.hud-item {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.hud-item small {
  font: 600 0.68rem / 1.1 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.hud-val {
  font: 700 var(--step-1) / 1.1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

.hud-score .hud-val {
  font-size: var(--step-2);
}

.timebar {
  position: relative;
  height: 26px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface);
}

.time-fill {
  position: absolute;
  inset: 0;
  background: var(--primary);
  transform-origin: left center;
  transform: scaleX(1);
}

.timebar.is-low .time-fill {
  background: var(--bad);
}

.timebar.is-rounds .time-fill {
  background: var(--good);
  transform: scaleX(0);
}

.time-text {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font: 700 var(--step--1) / 1 var(--font-num);
  color: var(--ink);
  background: var(--surface);
  padding: 2px 6px;
  border-radius: 6px;
}

.roundbar {
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  background: transparent;
}

.round-fill {
  display: block;
  height: 100%;
  background: var(--highlight);
  transform-origin: left center;
  transform: scaleX(0);
}

.banner {
  margin: 0;
  padding: 6px 12px;
  background: var(--highlight);
  color: var(--highlight-ink);
  font: 700 var(--step--1) / 1.3 var(--font-body);
  letter-spacing: 0.04em;
  border-radius: 6px;
  text-align: center;
}

.status {
  margin: 0;
  min-height: 1.5em;
  text-align: center;
  font: 600 var(--step-1) / 1.3 var(--font-display);
}

.stage {
  min-height: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.countdown {
  font: 800 5rem / 1 var(--font-display);
  margin-top: 40px;
  animation: pop 600ms ease-out;
}

.feedback {
  min-height: 3.2rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 12px;
  padding: 8px 12px;
  border-radius: var(--radius);
  text-align: center;
}

.feedback.is-ok {
  background: var(--good-bg);
  color: var(--good);
}

.feedback.is-bad {
  background: var(--bad-bg);
  color: var(--bad);
}

.fb-icon {
  font: 800 1.4rem / 1 var(--font-display);
}

.fb-pts {
  font: 700 var(--step-0) / 1 var(--font-num);
}

.fb-note {
  flex-basis: 100%;
  color: var(--ink);
  font-size: var(--step--1);
}

.fb-level {
  flex-basis: 100%;
  font-weight: 700;
  color: var(--ink);
}

.pause-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: var(--paper);
  border-radius: var(--radius);
}

/* Ortak seçenek ızgarası */
.choices {
  display: grid;
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 520px;
}

.choice {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 72px;
  padding: 10px;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  font: inherit;
  transition: border-color var(--dur), transform var(--dur);
}

.choice:hover:not(:disabled) {
  border-color: var(--ink);
}

.choice:active:not(:disabled) {
  transform: scale(0.97);
}

.choice:disabled {
  cursor: default;
}

.choice-key {
  position: absolute;
  top: 4px;
  left: 7px;
  font: 600 0.7rem / 1 var(--font-num);
  color: var(--muted);
}

.choice.is-correct {
  border-color: var(--good);
  background: var(--good-bg);
  box-shadow: inset 0 0 0 2px var(--good);
}

.choice.is-correct::after {
  content: '✓';
  position: absolute;
  top: 4px;
  right: 8px;
  color: var(--good);
  font-weight: 800;
}

.choice.is-wrong {
  border-color: var(--bad);
  background: var(--bad-bg);
}

.choice.is-wrong::after {
  content: '✕';
  position: absolute;
  top: 4px;
  right: 8px;
  color: var(--bad);
  font-weight: 800;
}

.label {
  font: 600 0.7rem / 1.2 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.shape-bg {
  fill: var(--shape-bg);
}

.shape-bg-stop {
  stop-color: var(--shape-bg);
}

svg.shape {
  display: block;
  max-width: 100%;
  height: auto;
}

/* Hafıza Izgarası */
.mg-grid {
  display: grid;
  grid-template-columns: repeat(var(--n), minmax(0, 1fr));
  gap: 8px;
  width: min(100%, 420px);
}

.mg-cell {
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--cell);
  color: var(--highlight-ink);
  font: 800 var(--step-1) / 1 var(--font-num);
  cursor: pointer;
  transition: background var(--dur), transform var(--dur);
}

.mg-cell:disabled {
  cursor: default;
}

.mg-cell.mg-lit {
  background: var(--cell-lit);
  border-color: var(--ink);
  transform: scale(1.04);
}

.mg-cell.mg-ok {
  background: var(--good-bg);
  border-color: var(--good);
  box-shadow: inset 0 0 0 3px var(--good);
}

.mg-cell.mg-wrong {
  background: var(--bad-bg);
  border-color: var(--bad);
}

.mg-cell.mg-wrong::after {
  content: '✕';
  color: var(--bad);
}

.mg-cell.mg-missed {
  background: var(--cell-lit);
  border: 3px dashed var(--ink);
}

/* Hızlı Eşleştirme */
.qm-target,
.ps-head,
.mr-ref {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 24px;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--radius);
}

/* Zihinden Hesap */
.mm-problem {
  font: 800 clamp(2rem, 9vw, 3.4rem) / 1.1 var(--font-num);
  font-variant-numeric: tabular-nums;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 4px solid var(--highlight);
  text-align: center;
}

.mm-num {
  font: 700 var(--step-2) / 1 var(--font-num);
  font-variant-numeric: tabular-nums;
}

/* Çift Odak */
.df-rule {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 16px;
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  text-align: center;
}

.df-rule.is-new {
  border-color: var(--ink);
  background: var(--highlight);
  color: var(--highlight-ink);
}

.df-rule.is-new .label {
  color: var(--highlight-ink);
}

.df-stage {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 460px;
}

.df-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 160px;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--radius);
}

.df-number {
  font: 800 4.5rem / 1 var(--font-num);
}

.df-caption {
  font-size: var(--step--1);
  color: var(--muted);
}

.df-distractors {
  grid-column: 1 / -1;
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  opacity: 0.55;
  font: 700 var(--step--1) / 1 var(--font-num);
}

.df-d {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.df-press {
  min-width: 200px;
  min-height: 64px;
  font-size: var(--step-2);
}

.df-press kbd {
  font: 600 0.7rem / 1 var(--font-body);
  opacity: 0.8;
}

/* Değişen Örüntü */
.ps-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 52px;
}

.ps-card.ps-target {

const ID_RE = /^[a-z][a-zA-Z0-9-]{0,40}$/;
const OPTION_KEY_RE = /^[a-z][a-zA-Z0-9]{0,20}$/;
const OPTION_VALUE_RE = /^[a-z][a-zA-Z0-9-]{0,20}$/;
const MAX_OPTION_GAMES = 50;
const MAX_OPTION_KEYS = 10;

  sound: true,

  relaxed: false, // süre baskısı kapalı: süresiz, turlu oturum
  adaptive: true, // otomatik zorluk
  startLevel: 'auto', // 'auto' | 1..10
  durationSec: 60,
  theme: 'auto', // 'auto' | 'light' | 'dark'

function defaultData() {
  return { version: SCHEMA_VERSION, settings: { ...DEFAULT_SETTINGS }, games: {}, sessions: [], options: {} };

function defaultGameRecord() {
  return { plays: 0, best: null, lastLevel: 1, history: [], tutorialSeen: false };

// Sürüm n'den n+1'e dönüştürücüler.
const MIGRATIONS = {
  // 0: sürüm alanı olmayan ilk taslak kayıtlar ({ settings, bestScores: { oyunId: skor } })
  0(old) {
    const data = defaultData();
    if (old.settings && typeof old.settings === 'object') data.settings = { ...data.settings, ...old.settings };
    if (old.bestScores && typeof old.bestScores === 'object') {
      for (const [id, value] of Object.entries(old.bestScores)) {

          data.games[id] = { ...defaultGameRecord(), best: { score: value, accuracy: null, avgRtMs: null } };
        }
      }
    }
    data.version = 1;
    return data;
  },
};

function migrate(raw) {
  let data = raw;
  let version = Number.isInteger(data.version) ? data.version : 0;
  if (version > SCHEMA_VERSION) throw new Error(`Kayıt sürümü (${version}) bu uygulamadan yeni`);
  while (version < SCHEMA_VERSION) {
    const step = MIGRATIONS[version];
    if (!step) throw new Error(`Sürüm ${version} için dönüştürücü yok`);
    data = step(data);
    version = data.version;
  }
  return sanitize(data);
}

const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
const finiteOrNull = (v) => (Number.isFinite(v) ? v : null);
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const pctOrNull = (v) => (Number.isFinite(v) ? clamp(v, 0, 100) : null);
const levelOf = (v) => (Number.isInteger(v) ? clamp(v, 1, 10) : 1);

// Yüklenen veriyi beklenen biçime zorlar; bilinmeyen alanları atar.
function sanitize(data) {
  const clean = defaultData();
  if (isObj(data.settings)) {
    for (const key of Object.keys(DEFAULT_SETTINGS)) {
      if (key in data.settings && typeof data.settings[key] === typeof DEFAULT_SETTINGS[key]) {

      } else if (key === 'startLevel' && Number.isInteger(data.settings[key])) {

    }

    if (![45, 60, 90].includes(s.durationSec)) s.durationSec = 60;
    if (!['auto', 'on', 'off'].includes(s.reducedMotion)) s.reducedMotion = 'auto';
    if (!['auto', 'light', 'dark'].includes(s.theme)) s.theme = 'auto';
    if (s.startLevel !== 'auto' && !Number.isInteger(s.startLevel)) s.startLevel = 'auto';

      out.lastLevel = levelOf(rec.lastLevel);
      out.tutorialSeen = rec.tutorialSeen === true;
      if (isObj(rec.best) && Number.isFinite(rec.best.score)) {

          score: rec.best.score,
          accuracy: pctOrNull(rec.best.accuracy),
          avgRtMs: finiteOrNull(rec.best.avgRtMs),

          .map((h) => ({

            score: h.score,
            accuracy: pctOrNull(h.accuracy) ?? 0,
            avgRtMs: finiteOrNull(h.avgRtMs),

      .filter((s) => isObj(s) && Number.isFinite(s.at) && typeof s.gameId === 'string' && ID_RE.test(s.gameId))
      .slice(-SESSION_LIMIT)
      .map((s) => ({
        at: s.at,
        gameId: s.gameId,
        category: typeof s.category === 'string' && ID_RE.test(s.category) ? s.category : '',
        score: finiteOrNull(s.score) ?? 0,
        accuracy: pctOrNull(s.accuracy) ?? 0,

            h('span', { class: 'hud-item hud-score' }, h('small', {}, 'Skor'), hudScore),
          ),
          h(
            'div',
            {
              class: `timebar${session.timed ? '' : ' is-rounds'}`,
              role: 'progressbar',
              'aria-label': session.timed ? 'Kalan süre' : 'Tur ilerlemesi',
              'aria-valuemin': 0,
              'aria-valuemax': 100,
            },
            timeFill,
            timeText,
          ),
          h('div', { class: 'roundbar', 'aria-hidden': 'true' }, roundFill),
          banner,
          h('h1', { class: 'visually-hidden' }, d.name),
          status,
          stage,
          feedback,
          pauseLayer,
        ),
      );

      const later = (fn, ms) => scheduled.push({ at: now() + ms, fn });

      const onKey = (e) => {
        if (e.key === 'Escape') {
          togglePause();
          e.preventDefault();
          return;
        }
        if (paused) return;
        for (const handler of keyHandlers) {
          if (handler(e)) {
            e.preventDefault();
            return;
          }
        }
      };
      document.addEventListener('keydown', onKey);

      let paused = false;
      function togglePause() {
        if (finished) return;
        paused = !paused;
        if (!paused) {
          session.resume();
          playClock.resume();
          pauseLayer.hidden = true;
          stage.inert = false;
          pauseBtn.focus();
        } else {
          session.pause();
          playClock.pause();
          pauseLayer.hidden = false;
          stage.inert = true;
          pauseLayer.querySelector('#resume').focus();
        }
      }

      function updateHud() {
        hudScore.textContent = fmtInt(session.score);
        hudLevel.textContent = String(session.level);
        hudStreak.textContent = String(session.streak);
      }

      function tick() {
        if (disposed) return;
        raf = requestAnimationFrame(tick);
        const t = now();
        // zamanlanmış işler (duraklatmaya duyarlı saat)
        if (scheduled.length) {
          const due = scheduled.filter((j) => j.at <= t);
          scheduled = scheduled.filter((j) => j.at > t);
          due.forEach((j) => j.fn());
        }
        if (session.timed && !session.practice) {
          const frac = session.timer.fraction();
          timeFill.style.transform = `scaleX(${frac})`;
          const secs = Math.ceil(session.timer.remaining() / 1000);
          timeText.textContent = `${secs} sn`;
          timeFill.parentElement.setAttribute('aria-valuenow', String(Math.round(frac * 100)));
          timeFill.parentElement.classList.toggle('is-low', secs <= 10);
          if (session.timer.expired() && (session.phase === PHASE.AWAITING || session.phase === PHASE.PRESENTING)) {
            finish(false);
            return;
          }
        } else if (!session.timed) {
          const frac = Math.min(1, session.roundNumber / RELAXED_ROUNDS);
          timeFill.style.transform = `scaleX(${frac})`;
          timeText.textContent = `${session.roundNumber}/${RELAXED_ROUNDS}`;
        } else {
          timeText.textContent = 'Alıştırma';
        }
        if (roundLimit) {
          roundFill.style.transform = `scaleX(${roundLimit.timer.fraction()})`;
          if (roundLimit.timer.expired()) {
            const map = roundLimit.map;
            roundLimit = null;
            answer(map ? map() : { timeout: true });
          }
        }
      }

      function newRound() {
        const round = session.nextRound();
        if (!round) finish(false);
        else renderRound(round);
      }

      function renderRound(round) {
        scheduled = [];
        keyHandlers = [];
        roundLimit = null;
        roundFill.style.transform = 'scaleX(0)';
        answered = false;
        feedback.className = 'feedback';
        clear(feedback);
        clear(stage);
        banner.hidden = !session.practice;
        banner.textContent = session.practice ? 'ALIŞTIRMA TURU · puan sayılmaz, süre işlemez' : '';
        updateHud();
        game.render({
          root: stage,
          round,
          level: session.level,
          practice: session.practice,
          relaxed,
          reducedMotion: reducedMotion(),
          answer,
          presented: () => session.phase === PHASE.PRESENTING && session.presented(),
          later,
          onKey: (fn) => keyHandlers.push(fn),
          status: (text) => (status.textContent = text),
          sound: (name) => audio.play(name),
          limit: (ms, map) => {
            roundLimit = { timer: createTimer({ durationMs: ms, now }), map };
            roundLimit.timer.start();
          },
        });
      }

      function answer(input) {
        if (answered || finished || paused) return;
        answered = true;
        roundLimit = null;
        const res = session.submit(input);
        updateHud();
        const ok = res.outcome === OUTCOME.CORRECT;
        const ignore = res.outcome === OUTCOME.IGNORE;
        const label = {
          [OUTCOME.CORRECT]: 'Doğru',
          [OUTCOME.WRONG]: 'Yanlış',
          [OUTCOME.FALSE_ALARM]: 'Yanlış alarm',
          [OUTCOME.MISS]: 'Kaçırdın',
          [OUTCOME.TIMEOUT]: 'Süre doldu',
          [OUTCOME.SKIP]: 'Boş geçildi',
        }[res.outcome];
        if (!ignore) {
          feedback.className = `feedback ${ok ? 'is-ok' : 'is-bad'}`;
          clear(feedback);
          feedback.append(
            h('span', { class: 'fb-icon', 'aria-hidden': 'true' }, ok ? '✓' : '✕'),
            h('strong', {}, label),
            res.practice ? h('span', { class: 'fb-pts' }, 'alıştırma') : h('span', { class: 'fb-pts' }, `${res.points >= 0 ? '+' : ''}${res.points}`),
            res.quickSwitch ? h('span', { class: 'fb-note' }, 'Kural değişimini hemen fark ettin!') : null,
            !ok && res.explanation ? h('span', { class: 'fb-note' }, res.explanation) : null,
          );
          audio.play(ok ? 'correct' : 'wrong');
        }
        if (res.levelChange.changed) {
          const up = res.levelChange.changed > 0;
          const toast = h('span', { class: `fb-level ${up ? 'up' : 'down'}` }, `Seviye ${res.levelChange.level} ${up ? '↑' : '↓'} · ${res.levelChange.reason}`);
          feedback.append(toast);
          if (up) audio.play('level');
          announce(toast.textContent);
        }
        const practiceDone = res.practice && !session.practice;
        if (practiceDone) feedback.append(h('span', { class: 'fb-note' }, 'Alıştırma bitti. Şimdi gerçek oyun başlıyor!'));
        const long = !ok && res.explanation;
        const delay = ignore ? 220 : practiceDone ? 1800 : long ? (res.steps ? 2800 : 1700) : ok ? 520 : 900;
        if (relaxed && long) {
          const cont = h('button', { type: 'button', class: 'btn btn-secondary btn-sm', id: 'continue', onclick: () => newRound() }, 'Devam');
          feedback.append(cont);
          keyHandlers = [(e) => (e.key === 'Enter' ? (cont.click(), true) : false)];
          cont.focus();
        } else {
          later(() => {
            if (!finished) newRound();
          }, delay);
        }
      }

      function finish(quit) {
        if (finished) return;
        finished = true;
        session.end();
        const result = session.result();
        if (quit && result.answered === 0) {
          cleanup();
          if (challenge) abandonChallenge(challenge);
          else intro(id);
          return;
        }
        repo.markTutorialSeen(id);
        const previousBest = repo.recordResult(result, { category: d.category });
        audio.play('end');
        cleanup();
        if (challenge) challengeNext(challenge, result);
        else resultScreen(result, previousBest);
      }

      function cleanup() {
        disposed = true;
        cancelAnimationFrame(raf);
        document.removeEventListener('keydown', onKey);
      }

      // 3-2-1 geri sayım, sonra ilk tur
      const count = h('div', { class: 'countdown', 'aria-live': 'assertive' });
      stage.append(count);
      const steps = reducedMotion() ? ['Hazır'] : ['3', '2', '1'];
      steps.forEach((txt, i) =>
        later(() => {
          count.textContent = txt;
          audio.play('count');
        }, i * 650),
      );
      later(() => {
        audio.play('start');
        renderRound(session.start());
      }, steps.length * 650);
      raf = requestAnimationFrame(tick);

      return () => {
        if (!finished) {
          finished = true;
          session.end();
        }
        cleanup();
      };
    });
  }

        ),
      );
      setTimeout(() => el.querySelector('#start-challenge')?.focus(), 0);
    });

  function challengeStep(state) {
    const step = state.plan[state.index];
    intro(step.gameId, { challenge: { ...state, step } });
  }

  function challengeNext(challenge, result) {
    const results = [...challenge.results, result];
    const index = challenge.index + 1;
    if (index < challenge.plan.length) challengeStep({ plan: challenge.plan, index, results });
    else challengeSummary(challenge.plan, results);
  }

  function abandonChallenge(challenge) {
    if (challenge.results.length) challengeSummary(challenge.plan.slice(0, challenge.results.length), challenge.results);
    else menu();
  }

  function challengeSummary(plan, results) {
    const sum = summarizeChallenge(results);
    show((el) => {

    });
  }

  // ---------------- İstatistik ----------------
  function sparkline(values) {
    if (values.length < 2) return h('span', { class: 'muted' }, '—');
    const w = 96;
    const hgt = 28;
    const max = Math.max(...values, 1);
    const pts = values.map((v, i) => [(i / (values.length - 1)) * (w - 6) + 3, hgt - 3 - (v / max) * (hgt - 6)]);
    const line = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const last = pts[pts.length - 1];
    return s(
      'svg',
      { viewBox: `0 0 ${w} ${hgt}`, width: w, height: hgt, class: 'spark', role: 'img', 'aria-label': `Son ${values.length} skor: ${values.join(', ')}` },
      s('polyline', { points: line, class: 'spark-line', fill: 'none' }),
      s('circle', { cx: last[0], cy: last[1], r: 2.8, class: 'spark-dot' }),
    );
  }

  function weekChart(days) {
    const w = 320;
    const hgt = 120;
    const max = Math.max(...days.map((d) => d.count), 1);
    const bw = (w - 20) / days.length;
    const names = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
    return s(
      'svg',
      { viewBox: `0 0 ${w} ${hgt}`, class: 'week-chart', role: 'img', 'aria-label': `Son 7 gün oturum sayıları: ${days.map((d) => d.count).join(', ')}` },
      s('line', { x1: 10, x2: w - 10, y1: hgt - 22, y2: hgt - 22, class: 'axis' }),
      days.map((d, i) => {
        const bh = (d.count / max) * (hgt - 46);
        const x = 10 + i * bw + bw * 0.2;
        return s(
          'g',
          {},
          s('rect', { x, y: hgt - 22 - bh, width: bw * 0.6, height: Math.max(bh, d.count ? 2 : 0), rx: 3, class: i === days.length - 1 ? 'bar bar-today' : 'bar' }),
          d.count ? s('text', { x: x + bw * 0.3, y: hgt - 26 - bh, class: 'bar-val', 'text-anchor': 'middle' }, document.createTextNode(String(d.count))) : null,
          s('text', { x: x + bw * 0.3, y: hgt - 6, class: 'bar-label', 'text-anchor': 'middle' }, document.createTextNode(names[new Date(d.dayStart).getDay()])),
        );
      }),
    );
  }

  // ---------------- Ayarlar ----------------
  function settingsScreen() {
    show((el) => {
      const st = repo.settings;
      const update = (patch) => {
        repo.updateSettings(patch);
        applySettings();
      };
      const toggle = (id, label, key, hint) =>
        h(
          'div',
          { class: 'field' },
          h('label', { class: 'switch', for: id },
            h('input', { type: 'checkbox', id, checked: st[key], onchange: (e) => update({ [key]: e.target.checked }) }),
            h('span', {}, label),
          ),
          hint ? h('p', { class: 'hint' }, hint) : null,
        );
      const select = (id, label, key, choices, parse = (v) => v) =>
        h(
          'div',
          { class: 'field' },
          h('label', { for: id }, label),
          h(
            'select',
            { id, onchange: (e) => update({ [key]: parse(e.target.value) }) },
            choices.map(([value, text]) => h('option', { value: String(value), selected: String(st[key]) === String(value) }, text)),
          ),
        );
      const confirmBtn = (id, label, confirmText, action) => {
        const btn = h('button', { type: 'button', class: 'btn btn-ghost btn-danger', id }, label);
        btn.addEventListener('click', () => {
          if (btn.dataset.armed) {
            action();
            return;
          }
          btn.dataset.armed = '1';
          btn.textContent = confirmText;
          setTimeout(() => {
            if (btn.isConnected) {
              delete btn.dataset.armed;
              btn.textContent = label;
            }
          }, 4000);
        });
        return btn;
      };
      const msg = h('p', { class: 'hint', 'aria-live': 'polite', id: 'data-msg' });
      const exportBox = h('textarea', { id: 'export-box', class: 'export-box', rows: 6, readonly: true, hidden: true, 'aria-label': 'Dışa aktarılan veri (JSON)' });
      const fileInput = h('input', { type: 'file', id: 'import-file', accept: 'application/json,.json', class: 'visually-hidden' });
      // İçe aktarma: önce dosya doğrulanır ve özetlenir, mevcut veri ancak onaydan sonra değişir.
      const importConfirm = h('div', { class: 'import-confirm', hidden: true, role: 'group', 'aria-label': 'İçe aktarma onayı' });
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files?.[0];
        fileInput.value = '';
        importConfirm.hidden = true;
        clear(importConfirm);
        if (!file) return;
        try {
          if (file.size > MAX_IMPORT_BYTES) throw new Error('Dosya 1 MB’tan büyük');
          const text = await file.text();
          const preview = repo.previewImport(text);
          importConfirm.append(
            h('p', { class: 'hint' }, `Dosyada ${preview.games} oyun kaydı ve ${preview.sessions} oturum var. İçe aktarırsan şu anki ilerlemen bunlarla değiştirilir.`),
            h(
              'div',
              { class: 'row-actions wrap' },
              h('button', {
                type: 'button',
                class: 'btn btn-primary',
                id: 'import-confirm',
                onclick: () => {
                  repo.importJson(text);
                  applySettings();
                  importConfirm.hidden = true;
                  msg.textContent = 'Veriler içe aktarıldı.';
                },
              }, 'Mevcut verinin yerine yaz'),
              h('button', {
                type: 'button',
                class: 'btn btn-ghost',
                onclick: () => {
                  importConfirm.hidden = true;
                  msg.textContent = 'İçe aktarma iptal edildi. Verilerin değişmedi.';
                },
